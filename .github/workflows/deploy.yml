name: Deploy Web + Worker (Cloudflare)

on:
  push:
    branches: [mnbots]
    paths: ['web/**', 'worker/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    outputs:
      worker_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      # Deploy and capture the workers.dev URL so the web build can be
      # wired to the real Worker (no manual WORKER_URL variable needed).
      - id: deploy
        name: Deploy Worker
        run: |
          set -eo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Worker URL: $URL"
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-web:
    name: Deploy Web (Pages)
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: ${{ vars.WORKER_URL }}
      # `pages deploy` fails with "Project not found" on first run if the
      # Pages project doesn't exist yet — create it only when missing.
      # No error masking: if auth is broken, this step fails loudly.
      - name: Ensure Pages project exists
        run: |
          if npx wrangler pages project list --json | grep -Eq '"name"[[:space:]]*:[[:space:]]*"muzii"'; then
            echo "Pages project 'muzii' already exists."
          else
            echo "Creating Pages project 'muzii'..."
            npx wrangler pages project create muzii --production-branch=mnbots
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=muzii --commit-dirty=true
