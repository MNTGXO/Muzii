name: Android player UI tests
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-ui-tests.yml']
permissions:
  contents: read
jobs:
  player-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test player and queue navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash -c 'set -o pipefail; cd android; gradle connectedDebugAndroidTest --stacktrace 2>&1 | tee /tmp/muzii-ui-test.log'
      - name: Report emulator test failures
        if: failure()
        run: |
          if [ -f /tmp/muzii-ui-test.log ]; then
            python3 -c "from pathlib import Path; s=Path('/tmp/muzii-ui-test.log').read_text()[-14000:]; print('::error title=Android UI test::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
          fi
          find android/app/build/outputs/androidTest-results -name '*.xml' -type f -exec sh -c 'for f; do echo "::error title=Instrumentation result::$(cat "$f" | tr "\n" " " | cut -c1-12000)"; done' sh {} + 2>/dev/null || true
