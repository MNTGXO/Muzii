name: Build & Release APK

on:
  push:
    branches: [mnbots]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Used only to post a build failure report (see the last step).
  issues: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP 8.5.2 + Kotlin 2.0.20 require Gradle 8.7. With no wrapper jar in
      # the repo, setup-gradle installs the latest Gradle (9.x), which is
      # incompatible — pin Gradle 8.7 explicitly.
      - name: Pin Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle-8.7.zip
          unzip -q /tmp/gradle-8.7.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      # Point the APK at the deployed backend. Falls back to the public
      # Pages site, which proxies /api/* to the Worker.
      #
      # Only ONE APK is produced. Shipping both a debug and a release APK
      # meant two identical-looking downloads and no way to tell which to
      # install; the debug build is also slower and carries test tooling.
      # If you need a debug build, run `gradle assembleDebug` locally.
      - name: Build APK
        working-directory: android
        env:
          MUZII_API_BASE_URL: ${{ vars.WORKER_URL || 'https://muzii.pages.dev/' }}
        run: gradle assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      # Rename before uploading so the downloaded file is obviously *the*
      # app, not `app-release.apk`.
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/muzii.apk
          ls -lh dist/

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: muzii-apk
          path: dist/muzii.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK download
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Muzii ${{ github.ref_name }}
          body: |
            ## Download Muzii for Android

            **`muzii.apk`** — install this one.

            On your phone, open this page, tap `muzii.apk`, and allow
            "install from unknown sources" if Android asks.

            Ad-free streaming, song radio that stays in your language, and
            collaborative Jam rooms.
          files: dist/muzii.apk
          draft: false
          prerelease: false

      # Build logs are hard to reach from a phone or a restricted network.
      # When the build breaks, post the compiler errors as a comment so they
      # are readable without digging through the Actions UI.
      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          if [ ! -f /tmp/build.log ]; then exit 0; fi
          {
            echo "### APK build failed"
            echo '```'
            grep -E "(^e: |error:|Caused by:|What went wrong|> Task .*FAILED)" /tmp/build.log | head -40
            echo '```'
            echo '<details><summary>last 60 lines</summary>'
            echo '```'
            tail -60 /tmp/build.log
            echo '```'
            echo '</details>'
          } > /tmp/report.md
          gh issue comment "$PR_NUMBER" --body-file /tmp/report.md \
            || gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/comments" \
                 -f body="$(cat /tmp/report.md)" || true
