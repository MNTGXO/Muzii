name: Build & Release APK

on:
  push:
    branches: [mnbots]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP 8.5.2 + Kotlin 2.0.20 require Gradle 8.7. With no wrapper jar in
      # the repo, setup-gradle installs the latest Gradle (9.x), which is
      # incompatible — pin Gradle 8.7 explicitly.
      - name: Pin Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle-8.7.zip
          unzip -q /tmp/gradle-8.7.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: muzii-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: muzii-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK download
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Muzii ${{ github.ref_name }}
          body: |
            ## Download Muzii for Android

            Grab the APK below and install it on your phone
            (allow "install from unknown sources" if prompted).

            - **muzii-release.apk** — recommended
            - **muzii-debug.apk** — for development

            Ad-free streaming + background play, Apple-Music-style UI.
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
