name: Build & Release APK

on:
  push:
    branches: [mnbots]
    tags: ['v*']
  # Compile every pull request that touches Android or this workflow. Without
  # this, a Kotlin error could only be discovered AFTER merging to mnbots —
  # the build simply never ran on a branch, so the PR looked green.
  pull_request:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write
  # Used only to post a build failure report (see the last step).
  issues: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # AGP 8.5.2 + Kotlin 2.0.20 require Gradle 8.7. With no wrapper jar in
      # the repo, setup-gradle installs the latest Gradle (9.x), which is
      # incompatible — pin Gradle 8.7 explicitly.
      - name: Pin Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle-8.7.zip
          unzip -q /tmp/gradle-8.7.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"
          gradle --version

      # Catch an unreadable or rotated keystore BEFORE spending minutes on
      # Gradle: an unopenable keystore otherwise surfaces as a confusing
      # signing failure deep inside the release task.
      - name: Verify the release keystore opens
        working-directory: android
        env:
          MUZII_STORE_PASSWORD: ${{ secrets.MUZII_STORE_PASSWORD }}
        run: |
          if [ ! -f keystore/muzii-release.p12 ]; then
            echo "::error::android/keystore/muzii-release.p12 is missing - builds would be signed with a throwaway key."
            exit 1
          fi
          keytool -list -keystore keystore/muzii-release.p12 \
            -storetype PKCS12 -storepass "${MUZII_STORE_PASSWORD:-muzii-release}" \
            -alias muzii
          echo "Release keystore is readable and contains the 'muzii' key."

      # Point the APK straight at the Worker. It used to default to the Pages
      # site, which only works if a generated `_redirects` proxy was written at
      # web-build time — so an APK could ship with every /api/* call 404ing and
      # silently run on its bundled demo tracks forever.
      #
      # Only ONE APK is produced. Shipping both a debug and a release APK
      # meant two identical-looking downloads and no way to tell which to
      # install; the debug build is also slower and carries test tooling.
      # If you need a debug build, run `gradle assembleDebug` locally.
      - name: Build APK
        working-directory: android
        env:
          MUZII_API_BASE_URL: ${{ vars.WORKER_URL || 'https://muzii.mn-bots.workers.dev/' }}
          MUZII_STORE_PASSWORD: ${{ secrets.MUZII_STORE_PASSWORD }}
          MUZII_KEY_PASSWORD: ${{ secrets.MUZII_KEY_PASSWORD }}
          # Monotonic version, so Android treats each release as newer than
          # the last. Without this every APK claimed to be 1.0.0 (code 1) and
          # the installer had no reason to replace what was already there.
          # NOTE: GitHub expressions have no arithmetic operators, so
          # `10000 + github.run_number` is a syntax error that fails the whole
          # workflow. run_number alone is monotonic and far exceeds the old
          # frozen value of 1, which is all Android requires.
          MUZII_VERSION_CODE: ${{ github.run_number }}
          MUZII_VERSION_NAME: ${{ github.ref_name == 'mnbots' && format('1.3.{0}', github.run_number) || github.ref_name }}
        # pipefail matters: a pipeline reports only its LAST command's status,
        # so without this tee succeeds, the step goes green, and a failed
        # compile only surfaces later as "Rename APK: no such file".
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee /tmp/build.log

      # Make compiler errors readable without the log viewer.
      #
      # Action logs are a redirect to a short-lived signed URL, which is
      # unreachable from a restricted network or a phone — and offline it is
      # impossible to tell a Kotlin error from a signing failure. Each `e:`
      # line becomes a check annotation, which the API serves directly.
      - name: Surface Kotlin compile errors
        if: failure()
        run: |
          if [ ! -f /tmp/build.log ]; then exit 0; fi
          grep -E "^e: |^w: .*unused|error:" /tmp/build.log | head -12 | while IFS= read -r line; do
            echo "::error title=Kotlin::$line"
          done
          echo "----- kotlin errors -----"
          grep -E "^e: " /tmp/build.log | head -25 || echo "(no e: lines found)"

      # Rename before uploading so the downloaded file is obviously *the*
      # app, not `app-release.apk`.
      - name: Rename APK
        run: |
          mkdir -p dist
          # Name the real cause instead of `cp: no such file`, and surface the
          # tail of the compile log so the actual Kotlin error is visible.
          if ! compgen -G "android/app/build/outputs/apk/release/*.apk" > /dev/null; then
            echo "::error::No release APK was produced - the build failed."
            echo "----- last 80 lines of the gradle log -----"
            tail -n 80 /tmp/build.log || true
            exit 1
          fi
          cp android/app/build/outputs/apk/release/*.apk dist/muzii.apk
          ls -lh dist/

      # A release signed with a throwaway debug key cannot install over the
      # previous version ("App not installed"), which is exactly how users got
      # stranded on old builds. Fail loudly if that ever regresses instead of
      # shipping an APK nobody can update.
      - name: Verify the APK is signed with the committed release key
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER=$(find "$SDK/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "::error::apksigner not found"; exit 1; fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs dist/muzii.apk | tee /tmp/certs.txt
          if ! grep -qi "CN=Muzii" /tmp/certs.txt; then
            echo "::error::APK is NOT signed with the Muzii release key - updates will fail to install."
            exit 1
          fi
          # Debug keys carry CN=Android Debug. Never ship one.
          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK was signed with the disposable Android debug key."
            exit 1
          fi
          echo "Signed with the stable Muzii key - in-place updates will work."

      # Instrumentation tests run on an Android device/emulator; at least
      # compile them on each PR so regressions cannot silently stop building.
      - name: Compile Android UI tests
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle assembleDebugAndroidTest

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: muzii-apk
          path: dist/muzii.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK download
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Muzii ${{ github.ref_name }}
          body: |
            ## Download Muzii for Android

            **`muzii.apk`** — install this one.

            On your phone, open this page, tap `muzii.apk`, and allow
            "install from unknown sources" if Android asks.

            Ad-free streaming, song radio that stays in your language, and
            collaborative Jam rooms.

            > **If you have an older Muzii installed, uninstall it once
            > first.** Older builds were signed with a different key, so
            > Android refuses to install over them. From this build on the
            > key is fixed and updates install normally.
          files: dist/muzii.apk
          draft: false
          prerelease: false

      # Build logs are hard to reach from a phone or a restricted network.
      # When the build breaks, post the compiler errors as a comment so they
      # are readable without digging through the Actions UI.
      - name: Report build failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          if [ ! -f /tmp/build.log ]; then exit 0; fi
          {
            echo "### APK build failed"
            echo '```'
            grep -E "(^e: |error:|Caused by:|What went wrong|> Task .*FAILED)" /tmp/build.log | head -40
            echo '```'
            echo '<details><summary>last 60 lines</summary>'
            echo '```'
            tail -60 /tmp/build.log
            echo '```'
            echo '</details>'
          } > /tmp/report.md
          gh issue comment "$PR_NUMBER" --body-file /tmp/report.md \
            || gh api "repos/${{ github.repository }}/commits/${GITHUB_SHA}/comments" \
                 -f body="$(cat /tmp/report.md)" || true
