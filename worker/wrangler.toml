name = "muzii"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
APP_NAME = "Muzii"
# Upstream music provider chain (see src/providers/index.ts):
#   "jiosaavn" (default) -> JioSaavn, YouTube Music, Demo
#   "youtube"            -> YouTube Music, JioSaavn, Demo
#   "demo"               -> Demo only
# JioSaavn leads because YouTube refuses most player calls from datacenter
# IPs and its media URLs are IP-bound, while JioSaavn serves plain CDN links
# the Worker can proxy. Every provider failure falls through to the next.
PROVIDER = "jiosaavn"

# Muzii Jam rooms (Durable Objects). Each jam <code> is one Durable Object
# named after the code, so the room's queue/playback state is serialised.
# The migration tag must never be edited once deployed — append new tags.
[[durable_objects.bindings]]
name = "JAM_ROOMS"
class_name = "JamRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JamRoom"]

# Optional: KV namespace for catalog caching.
# Create with: wrangler kv namespace create CATALOG
# [[kv_namespaces]]
# id = "..."
# key = "CATALOG"
